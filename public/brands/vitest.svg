<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <!-- Filtro de sombra suave para los elementos superiores -->
    <filter id="drop-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.18" />
    </filter>
  </defs>

  <g id="logo-mark">
    <!-- Capa inferior: Brazo superior izquierdo (Verde Claro) -->
    <path 
      d="M 32 120 L 80 168" 
      fill="none" 
      stroke="#b2cb82" 
      stroke-width="24" 
      stroke-linecap="round" 
    />

    <!-- Capa intermedia: V principal (Verde Oscuro) con sombra -->
    <path 
      d="M 75 163 L 130 218 L 224 124" 
      fill="none" 
      stroke="#6b9e1b" 
      stroke-width="24" 
      stroke-linecap="round" 
      stroke-linejoin="round"
      filter="url(#drop-shadow)" 
    />

    <!-- Capa superior: Rayo (Amarillo) con bordes suavizados y sombra -->
    <path 
      d="M 148 24 C 151 24, 153 26, 152 29 L 148 72 C 148 74, 150 76, 152 76 L 186 86 C 189 87, 190 90, 188 92 L 128 171 C 126 173, 123 172, 123 169 L 128 120 C 128 118, 126 116, 124 116 L 90 106 C 87 105, 86 102, 88 100 L 144 26 C 145 25, 146 24, 148 24 Z" 
      fill="#fbc02d" 
      stroke="#fbc02d" 
      stroke-width="4" 
      stroke-linejoin="round" 
      stroke-linecap="round"
      filter="url(#drop-shadow)" 
    />
  </g>
</svg>
