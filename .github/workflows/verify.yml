name: verify

# El ejecutor externo que faltaba: Vercel compila la preview, pero no corre los
# tests ni el gate de docs. Un empujon a main o una PR pasan por aqui antes del
# mergeo (odd/tasks/docs-verification.md S3).
on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.3.4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm test

      - run: pnpm lint:docs

      - run: pnpm build
