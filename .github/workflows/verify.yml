name: verify

# The outside executor that was missing: Vercel builds the preview but runs
# neither the tests nor the docs gate. A push to main or a PR goes through here
# before merging (odd/tasks/docs-verification.md S3).
#
# Actions are pinned by full commit SHA, not by tag: a tag can be moved to
# another commit after review (supply chain). The version comment keeps the pin
# readable, and a bump is a deliberate commit, never a bot's.
on:
  push:
    branches: [main]
  pull_request:

# Least privilege: the job only reads the repo (actions, install, build) and
# needs no write scope. Without this block the token inherits the repository
# default, which can be read-write on older accounts: a compromised action
# would find a token that can push.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 12.3.4

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm test

      - run: pnpm lint:docs

      - run: pnpm audit:i18n

      - run: pnpm build
